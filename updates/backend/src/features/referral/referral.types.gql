# Enums
enum ReferralStatusEnum {
  PENDING
  QUALIFIED
  COMPLETED
  EXPIRED
  CANCELLED
}

enum RewardStatusEnum {
  PENDING
  AVAILABLE
  REDEEMED
  EXPIRED
  CANCELLED
}

enum RewardTypeEnum {
  FREE_RIDE
  WALLET_CREDIT
  DISCOUNT_PERCENTAGE
  DISCOUNT_FIXED
}

enum CampaignTypeEnum {
  SIGNUP
  SPECIAL
  SEASONAL
  TARGETED
}

enum CampaignStatusEnum {
  DRAFT
  ACTIVE
  PAUSED
  ENDED
  CANCELLED
}

# Types
type ReferralCode {
  id: ID!
  userId: ID!
  userType: String!
  code: String!
  timesUsed: Int!
  maxUsageLimit: Int
  isActive: Boolean!
  isUsable: Boolean!
  campaignId: ID
  campaign: ReferralCampaign
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReferralTransaction {
  id: ID!
  referrerId: ID!
  referrerType: String!
  refereeId: ID!
  refereeType: String!
  referralCode: String!
  campaignId: ID
  campaign: ReferralCampaign
  status: ReferralStatusEnum!
  qualifiedAt: DateTime
  completedAt: DateTime
  referrerWalletBalance: Number!
  refereeWalletBalance: Number!
  requiredWalletBalance: Number!
  referrerReward: ReferralReward
  refereeReward: ReferralReward
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReferralReward {
  id: ID!
  userId: ID!
  userType: String!
  rewardType: RewardTypeEnum!
  rewardValue: Number!
  maxValue: Number
  referralTransactionId: ID!
  campaignId: ID
  campaign: ReferralCampaign
  isReferrer: Boolean!
  status: RewardStatusEnum!
  availableFrom: DateTime
  expiresAt: DateTime
  redeemedAt: DateTime
  tripId: ID
  description: String!
  isUsable: Boolean!
  hasExpired: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReferralCampaign {
  id: ID!
  name: String!
  description: String
  type: CampaignTypeEnum!
  status: CampaignStatusEnum!
  startDate: DateTime!
  endDate: DateTime
  isActive: Boolean!
  minWalletBalance: Number!

  # Referrer rewards
  referrerRewardType: RewardTypeEnum!
  referrerRewardValue: Number!
  referrerRewardMaxValue: Number

  # Referee rewards
  refereeRewardType: RewardTypeEnum!
  refereeRewardValue: Number!
  refereeRewardMaxValue: Number

  # Limits
  maxTotalRedemptions: Int
  currentRedemptions: Int!
  maxRedemptionsPerUser: Int

  # Eligibility
  eligibleUserTypes: [String!]!

  # Reward settings
  rewardExpiryDays: Int
  autoApplyReward: Boolean!

  # Tracking
  totalReferrals: Int!
  qualifiedReferrals: Int!
  completedReferrals: Int!

  # Admin
  createdBy: ID!
  lastModifiedBy: ID!

  termsAndConditions: String

  # Virtuals
  isCurrentlyActive: Boolean!
  hasReachedLimit: Boolean!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReferralStats {
  referralCode: String
  totalReferrals: Int!
  pendingReferrals: Int!
  qualifiedReferrals: Int!
  completedReferrals: Int!
  availableRewards: Int!
  redeemedRewards: Int!
  rewards: [ReferralRewardSummary!]!
}

type ReferralRewardSummary {
  id: ID!
  type: RewardTypeEnum!
  value: Number!
  status: RewardStatusEnum!
  description: String!
  expiresAt: DateTime
}

type ReferralCodeValidation {
  isValid: Boolean!
  error: String
  campaign: ReferralCampaign
}

type QualificationCheck {
  qualified: Boolean!
  message: String!
}

# Inputs
input ApplyReferralCodeInput {
  referralCode: String!
}

# Extend types
extend type Query {
  # Get my referral code
  myReferralCode: ReferralCode!

  # Get my referral stats
  myReferralStats: ReferralStats!

  # Get my available rewards
  myAvailableRewards: [ReferralReward!]!

  # Validate a referral code
  validateReferralCode(code: String!): ReferralCodeValidation!

  # Get active campaigns
  getActiveCampaigns: [ReferralCampaign!]!
}

extend type Mutation {
  # Generate a custom referral code
  generateCustomReferralCode(customCode: String!): ReferralCode!
}
