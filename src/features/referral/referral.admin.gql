# NEW: Constraint and Reward Definition Inputs
input CreateConstraintDefinitionInput {
  type: String!
  name: String!
  description: String!
  valueType: String!
  defaultValue: JSON
  appliesTo: String!
  unit: String
  minValue: Float
  maxValue: Float
}

input CreateRewardDefinitionInput {
  type: String!
  name: String!
  description: String!
  valueType: String!
  defaultValue: Float
  unit: String
  minValue: Float
  maxValue: Float
  requiresMaxValue: Boolean
}

# NEW: Campaign Constraint and Reward Inputs
input CampaignConstraintInput {
  constraintType: String!
  appliesTo: String!
  value: JSON
  userTypes: [String!]
}

input CampaignRewardInput {
  rewardType: String!
  value: Float!
  maxValue: Float
}

# Admin Inputs
input CreateCampaignInput {
  name: String!
  description: String
  type: CampaignTypeEnum!
  startDate: DateTime!
  endDate: DateTime

  # NEW: Arrays of constraints and rewards
  constraints: [CampaignConstraintInput!]!
  referrerRewards: [CampaignRewardInput!]!
  refereeRewards: [CampaignRewardInput!]!

  # OLD: Kept for backward compatibility (deprecated)
  minWalletBalance: Number

  # Referrer rewards (OLD - deprecated)
  referrerRewardType: RewardTypeEnum
  referrerRewardValue: Number
  referrerRewardMaxValue: Number

  # Referee rewards (OLD - deprecated)
  refereeRewardType: RewardTypeEnum
  refereeRewardValue: Number
  refereeRewardMaxValue: Number

  # Limits
  maxTotalRedemptions: Int
  maxRedemptionsPerUser: Int

  # Eligibility
  eligibleUserTypes: [String!]

  # Reward settings
  rewardExpiryDays: Int
  autoApplyReward: Boolean

  termsAndConditions: String
}

input UpdateCampaignInput {
  name: String
  description: String
  type: CampaignTypeEnum
  startDate: DateTime
  endDate: DateTime
  isActive: Boolean
  status: CampaignStatusEnum

  # NEW: Arrays of constraints and rewards
  constraints: [CampaignConstraintInput!]
  referrerRewards: [CampaignRewardInput!]
  refereeRewards: [CampaignRewardInput!]

  # OLD: Kept for backward compatibility (deprecated)
  minWalletBalance: Number

  # Referrer rewards (OLD - deprecated)
  referrerRewardType: RewardTypeEnum
  referrerRewardValue: Number
  referrerRewardMaxValue: Number

  # Referee rewards (OLD - deprecated)
  refereeRewardType: RewardTypeEnum
  refereeRewardValue: Number
  refereeRewardMaxValue: Number

  # Limits
  maxTotalRedemptions: Int
  maxRedemptionsPerUser: Int

  # Eligibility
  eligibleUserTypes: [String!]

  # Reward settings
  rewardExpiryDays: Int
  autoApplyReward: Boolean

  termsAndConditions: String
}

input ReferralFilterInput {
  status: ReferralStatusEnum
  campaignId: ID
  startDate: DateTime
  endDate: DateTime
  referrerId: ID
  refereeId: ID
}

input RewardFilterInput {
  status: RewardStatusEnum
  userId: ID
  campaignId: ID
  rewardType: RewardTypeEnum
}

# NEW: Constraint and Reward Definition Types
type ConstraintDefinition {
  id: ID!
  type: String!
  name: String!
  description: String!
  valueType: String!
  defaultValue: JSON
  appliesTo: String!
  isActive: Boolean!
  isSystemDefined: Boolean!
  unit: String
  minValue: Float
  maxValue: Float
  createdBy: String!
  lastModifiedBy: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type RewardDefinition {
  id: ID!
  type: String!
  name: String!
  description: String!
  valueType: String!
  defaultValue: Float
  isActive: Boolean!
  isSystemDefined: Boolean!
  unit: String
  minValue: Float
  maxValue: Float
  requiresMaxValue: Boolean!
  createdBy: String!
  lastModifiedBy: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# NEW: Campaign Constraint and Reward Instance Types
type CampaignConstraint {
  constraintType: String!
  appliesTo: String!
  value: JSON
  userTypes: [String!]
}

type CampaignReward {
  rewardType: String!
  value: Float!
  maxValue: Float
}

# Admin Types
type ReferralAnalytics {
  totalReferrals: Int!
  totalQualified: Int!
  totalCompleted: Int!
  totalPending: Int!
  totalRewardsIssued: Int!
  totalRewardsRedeemed: Int!
  conversionRate: Float!
  averageTimeToQualification: Float
}

type CampaignAnalytics {
  campaignId: ID!
  campaignName: String!
  totalReferrals: Int!
  qualifiedReferrals: Int!
  completedReferrals: Int!
  conversionRate: Float!
}

# Extend Query
extend type Query {
  # NEW: Constraint and Reward Definition Queries
  listConstraintDefinitions(activeOnly: Boolean): [ConstraintDefinition!]!
  listRewardDefinitions(activeOnly: Boolean): [RewardDefinition!]!
  getConstraintDefinition(id: ID!): ConstraintDefinition!
  getRewardDefinition(id: ID!): RewardDefinition!

  # Admin: List all campaigns
  listReferralCampaigns(
    filter: CampaignStatusEnum
    pagination: PaginationInput
  ): [ReferralCampaign!]!

  # Admin: Get a specific campaign
  getReferralCampaign(id: ID!): ReferralCampaign!

  # Admin: List all referral transactions
  listReferralTransactions(
    filter: ReferralFilterInput
    pagination: PaginationInput
  ): [ReferralTransaction!]!

  # Admin: Get a specific transaction
  getReferralTransaction(id: ID!): ReferralTransaction!

  # Admin: List all rewards
  listReferralRewards(
    filter: RewardFilterInput
    pagination: PaginationInput
  ): [ReferralReward!]!

  # Admin: Get referral analytics
  getReferralAnalytics(
    startDate: DateTime
    endDate: DateTime
  ): ReferralAnalytics!

  # Admin: Get campaign analytics
  getCampaignAnalytics(campaignId: ID!): CampaignAnalytics!

  # Admin: Get system referral config
  getReferralSystemConfig: SystemConfig!
}

# Extend Mutation
extend type Mutation {
  # NEW: Constraint Definition Management
  createConstraintDefinition(input: CreateConstraintDefinitionInput!): ConstraintDefinition!
  updateConstraintDefinition(id: ID!, input: CreateConstraintDefinitionInput!): ConstraintDefinition!
  toggleConstraintDefinition(id: ID!, isActive: Boolean!): ConstraintDefinition!
  deleteConstraintDefinition(id: ID!): Boolean!

  # NEW: Reward Definition Management
  createRewardDefinition(input: CreateRewardDefinitionInput!): RewardDefinition!
  updateRewardDefinition(id: ID!, input: CreateRewardDefinitionInput!): RewardDefinition!
  toggleRewardDefinition(id: ID!, isActive: Boolean!): RewardDefinition!
  deleteRewardDefinition(id: ID!): Boolean!

  # NEW: Seed initial data
  seedReferralDefinitions: Boolean!

  # Admin: Create a new campaign
  createReferralCampaign(input: CreateCampaignInput!): ReferralCampaign!

  # Admin: Update a campaign
  updateReferralCampaign(
    id: ID!
    input: UpdateCampaignInput!
  ): ReferralCampaign!

  # Admin: Delete a campaign
  deleteReferralCampaign(id: ID!): Boolean!

  # Admin: Activate/Deactivate a campaign
  toggleCampaignStatus(id: ID!, isActive: Boolean!): ReferralCampaign!

  # Admin: Change campaign status
  changeCampaignStatus(id: ID!, status: CampaignStatusEnum!): ReferralCampaign!

  # Admin: Manually check and qualify referrals
  checkPendingReferrals: Int!

  # Admin: Expire old rewards
  expireOldRewards: Int!

  # Admin: Cancel a referral transaction
  cancelReferralTransaction(id: ID!, reason: String): ReferralTransaction!

  # Admin: Cancel a reward
  cancelReward(id: ID!, reason: String): ReferralReward!

  # Admin: Update system referral config (min wallet balance)
  updateReferralSystemConfig(minWalletBalance: Number!): SystemConfig!
}
